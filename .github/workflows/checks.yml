name: Tests and lint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run format --prefix frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dvoinik .
      - name: Simulation works without any network
        run: docker run --rm --network none dvoinik python cli.py senior_deposit --mock --n 50
      - name: Restore SQLite and open a report without network access
        timeout-minutes: 2
        run: |
          docker run --rm -i --network none --no-healthcheck \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            -e DVOINIK_HOST=127.0.0.1 -e DVOINIK_AUTH_MODE=local \
            dvoinik python - < tests/smoke_restore.py
      - name: Service starts in the container
        run: |
          docker run -d --name dvoinik -p 127.0.0.1:8501:8501 -e DVOINIK_AUTH_MODE=demo dvoinik
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8501/ > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8501/ | grep -q 'id="root"'
          curl -sS -D - -o /dev/null http://127.0.0.1:8501/ | grep -qi "content-security-policy: default-src 'self'"
          docker exec dvoinik test -f /data/.deploy-jobs.lock
          docker logs dvoinik
  promote-vps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish tested revision for the VPS
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Main has advanced; skipping this revision."
            exit 0
          fi
          # A late run cannot replace a newer revision: no force push.
          git push origin "$GITHUB_SHA:refs/heads/deploy/vps"

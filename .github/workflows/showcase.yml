name: Online showcase
# Ручной запуск: публикует статическую витрину на GitHub Pages.
# Перед первым запуском включите Settings → Pages → Source: GitHub Actions.
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_showcase.py frontend/showcase-data.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx vite build
        working-directory: frontend
        env:
          VITE_SHOWCASE: '1'
      - run: cp frontend/showcase-data.json frontend/dist-showcase/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-showcase
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
